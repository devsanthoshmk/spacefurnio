name: Deploy Backend Worker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/ecommerce-backend/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Worker
        run: pnpm --filter server-worker build

      - name: Run Vitest Suite
        run: pnpm --filter server-worker test --run

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '23c1d5f8c743a085716fe51f52512bd7' }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
